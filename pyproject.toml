[project]
name = "slopproof"
version = "0.1.0"
description = "Proof, not vibes: verify vulnerability reports by checking claims against real code and reproducing them in a sandbox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "tavily-python>=0.8.5",
    "tree-sitter>=0.26.0",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.1.1",
]

[project.scripts]
slopproof = "slopproof.cli:main"
slopproof-web = "slopproof.server:main"
