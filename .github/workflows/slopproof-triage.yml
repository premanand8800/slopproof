# Example workflow for a project that wants SlopProof on incoming security issues.
# Add NEBIUS_API_KEY and TAVILY_API_KEY as repository secrets, then label an issue "security-report".
name: SlopProof triage
on:
  issues:
    types: [labeled]
permissions:
  issues: write
  contents: read
jobs:
  triage:
    if: github.event.label.name == 'security-report'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: premanand8800/slopproof
      - uses: astral-sh/setup-uv@v6
      - name: Build sandbox image
        run: docker build -t slopproof-sandbox -f docker/Dockerfile.sandbox docker
      - name: Triage
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: uv run slopproof "${{ github.event.issue.html_url }}" --markdown triage.md --out triage.json
      - name: Post summary for maintainers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.html_url }}" --body-file triage.md
      - uses: actions/upload-artifact@v4
        with:
          name: slopproof-triage
          path: triage.json
